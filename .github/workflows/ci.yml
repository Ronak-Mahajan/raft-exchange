name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Five toolchain/stdlib legs on two platforms. The golden-vector test
    # makes any cross-build divergence in observable engine state a hard
    # failure, and the simulator's random draws are specified bit for bit
    # (sim.hpp uniform_in/uniform_01), so a seed names the same universe on
    # libstdc++, libc++ and MinGW. Ubuntu compilers are pinned to the
    # versions the ubuntu-24.04 image ships; the Windows leg uses whatever
    # MinGW g++ windows-latest preinstalls (its version is printed).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc
            os: ubuntu-24.04
            cxx: g++-13
            flags: ""
            apt: ""
          - name: ubuntu-clang-libstdcxx
            os: ubuntu-24.04
            cxx: clang++-18
            flags: ""
            apt: ""
          - name: ubuntu-clang-libcxx
            os: ubuntu-24.04
            cxx: clang++-18
            flags: "-stdlib=libc++"
            apt: "libc++-18-dev libc++abi-18-dev"
          - name: ubuntu-gcc-asan-ubsan
            os: ubuntu-24.04
            cxx: g++-13
            flags: "-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g"
            apt: ""
          - name: windows-mingw-gcc
            os: windows-latest
            cxx: g++
            flags: ""
            apt: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: install extra packages
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: build and run both suites
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
          EXTRA: ${{ matrix.flags }}
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: |
          {
            "$CXX" --version
            "$CXX" -std=c++20 -O2 -Wall -Wextra $EXTRA tests/test_raft.cpp -o test_raft
            "$CXX" -std=c++20 -O2 -Wall -Wextra $EXTRA tests/test_exchange.cpp -o test_exchange
            ./test_raft
            ./test_exchange
          } 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-log-${{ matrix.name }}
          path: ci.log
          if-no-files-found: ignore
          retention-days: 14

  mutants:
    # Mutation gate. The committed patches must be exactly what
    # mutants/regen.sh generates from the current src/ (a stale, orphaned
    # or missing patch fails), and every patch must apply, build, and die
    # as killed/assert: a named FAIL line and exit 1. A survivor, a
    # stillborn mutant, or a kill by crash, timeout or unexplained exit
    # fails the build (MUTANT_STRICT=1). See mutants/README.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: patches match mutants/regen.sh
        shell: bash
        run: |
          {
            rm -f mutants/*.patch
            bash mutants/regen.sh
            drift="$(git status --porcelain -- mutants/)"
            if [ -n "$drift" ]; then
              echo "mutants/*.patch differ from what mutants/regen.sh generates:"
              echo "$drift"
              git diff -- mutants/
              exit 1
            fi
            echo "every committed patch matches mutants/regen.sh"
          } 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: run the mutant table
        shell: bash
        env:
          CXX: g++-13
          MUTANT_STRICT: "1"
          MUTANT_TIMEOUT: "300"   # per suite per mutant; timeout-minutes caps the whole job
        run: |
          bash mutants/run.sh 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-log-mutants
          path: ci.log
          if-no-files-found: ignore
          retention-days: 14
